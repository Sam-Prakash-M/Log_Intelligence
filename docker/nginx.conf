# Load balancer in front of the app replicas.
# Docker's DNS returns every replica for "app"; resolving through a variable makes
# nginx look the name up again every few seconds, so `--scale app=N` needs no restart.
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    location / {
        set $upstream http://app:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }
}
